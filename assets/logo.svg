<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Added Square Background with Rounded Corners (Android Squircle style) -->
    <rect width="512" height="512" rx="115" fill="#FFFFFF" />

    <!-- Definitions for Gradients and Shadows -->
    <defs>
        <!-- Dark Navy Gradient for the Pin -->
        <linearGradient id="navyGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1E3A8A" /> <!-- Blue-900 -->
            <stop offset="100%" stop-color="#0F172A" /> <!-- Slate-900 -->
        </linearGradient>

        <!-- Soft Drop Shadow -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="6" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge> 
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/> 
            </feMerge>
        </filter>
    </defs>

    <!-- Main Icon Group -->
    <!-- Centered vertically (roughly +26px from origin) since text is gone -->
    <g transform="translate(0, 26)" filter="url(#softShadow)">
        
        <!-- The Location Pin (Dark Navy) -->
        <path d="M256 60C178.7 60 116 122.7 116 200C116 296.2 238.5 394.2 243.8 398.4C250.6 403.8 261.4 403.8 268.2 398.4C273.5 394.2 396 296.2 396 200C396 122.7 333.3 60 256 60Z" 
              fill="url(#navyGradient)" />

        <!-- The Person Icon (White) -->
        <g transform="translate(0, -15)">
            <!-- Head -->
            <circle cx="256" cy="190" r="38" fill="#FFFFFF" /> 
            
            <!-- Body/Shoulders -->
            <path d="M196 275C196 241.9 222.9 215 256 215C289.1 215 316 241.9 316 275V285H196V275Z" 
                  fill="#FFFFFF" /> 
        </g>
    </g>

</svg>